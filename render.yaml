services:
  - type: web
    name: cinemine-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CINEMINE_JWT_SECRET
        generateValue: true
      - key: CINEMINE_CORS_ORIGINS
        sync: false